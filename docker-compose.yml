services:
  postgres:
    image: postgres:16
    container_name: smart-city-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_city_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  osrm-prepare-foot:
    image: osrm/osrm-backend:latest
    platform: linux/amd64
    container_name: smart-city-osrm-prepare-foot
    profiles: ["osrm-prepare"]
    entrypoint: /bin/sh
    command:
      - -lc
      - >
        set -e;
        test -f "/data/source/${OSM_FILE:-romania-260322.osm.pbf}";
        mkdir -p /data/foot;
        cp "/data/source/${OSM_FILE:-romania-260322.osm.pbf}" /data/foot/;
        osrm-extract -p /opt/foot.lua "/data/foot/${OSM_FILE:-romania-260322.osm.pbf}";
        osrm-partition "/data/foot/${OSM_DATASET:-romania-260322}.osrm";
        osrm-customize "/data/foot/${OSM_DATASET:-romania-260322}.osrm";
    volumes:
      - ./osrm-service/data:/data

  osrm-prepare-driving:
    image: osrm/osrm-backend:latest
    platform: linux/amd64
    container_name: smart-city-osrm-prepare-driving
    profiles: ["osrm-prepare"]
    entrypoint: /bin/sh
    command:
      - -lc
      - >
        set -e;
        test -f "/data/source/${OSM_FILE:-romania-260322.osm.pbf}";
        mkdir -p /data/driving;
        cp "/data/source/${OSM_FILE:-romania-260322.osm.pbf}" /data/driving/;
        osrm-extract -p /opt/car.lua "/data/driving/${OSM_FILE:-romania-260322.osm.pbf}";
        osrm-partition "/data/driving/${OSM_DATASET:-romania-260322}.osrm";
        osrm-customize "/data/driving/${OSM_DATASET:-romania-260322}.osrm";
    volumes:
      - ./osrm-service/data:/data

  osrm-foot:
    image: osrm/osrm-backend:latest
    platform: linux/amd64
    container_name: smart-city-osrm-foot
    restart: unless-stopped
    command: osrm-routed --algorithm mld --port 5000 "/data/foot/${OSM_DATASET:-romania-260322}.osrm"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '</dev/tcp/127.0.0.1/5000'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    volumes:
      - ./osrm-service/data:/data

  osrm-driving:
    image: osrm/osrm-backend:latest
    platform: linux/amd64
    container_name: smart-city-osrm-driving
    restart: unless-stopped
    command: osrm-routed --algorithm mld --port 5001 "/data/driving/${OSM_DATASET:-romania-260322}.osrm"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '</dev/tcp/127.0.0.1/5001'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    volumes:
      - ./osrm-service/data:/data

  aco-service:
    build:
      context: ./aco-service
    container_name: smart-city-aco
    restart: unless-stopped
    environment:
      OSRM_FOOT_BASE_URL: http://osrm-foot:5000
      OSRM_DRIVING_BASE_URL: http://osrm-driving:5001
      HTTP_OSRM_TIMEOUT_SECONDS: ${HTTP_OSRM_TIMEOUT_SECONDS:-25}
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '</dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "8000:8000"
    depends_on:
      osrm-foot:
        condition: service_healthy
      osrm-driving:
        condition: service_healthy

  verification-service:
    build:
      context: ./verification-service
    container_name: smart-city-verification
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8090/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 8s
    ports:
      - "8090:8090"

  backend:
    build:
      context: ./backend
    container_name: smart-city-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-smart_city_db}
      ACO_SERVICE_URL: http://aco-service:8000
      VERIFICATION_SERVICE_URL: http://verification-service:8090
      VERIFICATION_UPLOAD_DIR: /app/uploads/verification
    volumes:
      - verification_uploads:/app/uploads/verification
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 8s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      aco-service:
        condition: service_healthy
      verification-service:
        condition: service_healthy

  frontend-web:
    build:
      context: ./frontend-web
    container_name: smart-city-frontend-web
    restart: unless-stopped
    ports:
      - "8096:80"
    depends_on:
      backend:
        condition: service_healthy
      aco-service:
        condition: service_healthy

volumes:
  postgres_data:
  verification_uploads:
