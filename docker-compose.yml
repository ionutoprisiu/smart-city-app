services:
  postgres:
    image: postgres:16
    container_name: licenta-postgres
    profiles: ["with-db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-licenta_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  osrm-prepare-foot:
    image: osrm/osrm-backend:latest
    container_name: licenta-osrm-prepare-foot
    profiles: ["osrm-prepare"]
    entrypoint: /bin/sh
    command:
      - -lc
      - >
        set -e;
        test -f "/data/source/${OSM_FILE:-cluj.osm.pbf}";
        mkdir -p /data/foot;
        cp "/data/source/${OSM_FILE:-cluj.osm.pbf}" /data/foot/;
        osrm-extract -p /opt/foot.lua "/data/foot/${OSM_FILE:-cluj.osm.pbf}";
        osrm-partition "/data/foot/${OSM_DATASET:-cluj.osm}.osrm";
        osrm-customize "/data/foot/${OSM_DATASET:-cluj.osm}.osrm";
    volumes:
      - ./osrm-data:/data

  osrm-prepare-driving:
    image: osrm/osrm-backend:latest
    container_name: licenta-osrm-prepare-driving
    profiles: ["osrm-prepare"]
    entrypoint: /bin/sh
    command:
      - -lc
      - >
        set -e;
        test -f "/data/source/${OSM_FILE:-cluj.osm.pbf}";
        mkdir -p /data/driving;
        cp "/data/source/${OSM_FILE:-cluj.osm.pbf}" /data/driving/;
        osrm-extract -p /opt/car.lua "/data/driving/${OSM_FILE:-cluj.osm.pbf}";
        osrm-partition "/data/driving/${OSM_DATASET:-cluj.osm}.osrm";
        osrm-customize "/data/driving/${OSM_DATASET:-cluj.osm}.osrm";
    volumes:
      - ./osrm-data:/data

  osrm-foot:
    image: osrm/osrm-backend:latest
    container_name: licenta-osrm-foot
    restart: unless-stopped
    command: osrm-routed --algorithm mld --port 5000 "/data/foot/${OSM_DATASET:-cluj.osm}.osrm"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '</dev/tcp/127.0.0.1/5000'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    volumes:
      - ./osrm-data:/data

  osrm-driving:
    image: osrm/osrm-backend:latest
    container_name: licenta-osrm-driving
    restart: unless-stopped
    command: osrm-routed --algorithm mld --port 5001 "/data/driving/${OSM_DATASET:-cluj.osm}.osrm"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '</dev/tcp/127.0.0.1/5001'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    volumes:
      - ./osrm-data:/data

  aco-service:
    build:
      context: ./aco-service
    container_name: licenta-aco
    restart: unless-stopped
    environment:
      OSRM_FOOT_BASE_URL: http://osrm-foot:5000
      OSRM_DRIVING_BASE_URL: http://osrm-driving:5001
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '</dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "8000:8000"
    depends_on:
      osrm-foot:
        condition: service_healthy
      osrm-driving:
        condition: service_healthy

  verification-service:
    build:
      context: ./verification-service
    container_name: licenta-verification
    restart: unless-stopped
    environment:
      VERIFICATION_APPROVE_THRESHOLD: ${VERIFICATION_APPROVE_THRESHOLD:-0.62}
      VERIFICATION_MANUAL_THRESHOLD: ${VERIFICATION_MANUAL_THRESHOLD:-0.50}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8090/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 8s
    ports:
      - "8090:8090"

  backend:
    build:
      context: ./backend
    container_name: licenta-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@host.docker.internal:5432/${POSTGRES_DB:-licenta_db}
      ACO_SERVICE_URL: http://aco-service:8000
      VERIFICATION_SERVICE_URL: http://verification-service:8090
      CORS_ORIGINS_RAW: "*"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 8s
    ports:
      - "8080:8080"
    depends_on:
      aco-service:
        condition: service_healthy
      verification-service:
        condition: service_healthy

volumes:
  postgres_data:
