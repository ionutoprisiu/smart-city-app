services:
  postgres:
    image: postgres:16
    container_name: licenta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-licenta_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  osrm-prepare-foot:
    image: osrm/osrm-backend:latest
    platform: linux/amd64
    container_name: licenta-osrm-prepare-foot
    profiles: ["osrm-prepare"]
    entrypoint: /bin/sh
    command:
      - -lc
      - >
        set -e;
        test -f "/data/source/${OSM_FILE:-romania-260322.osm.pbf}";
        mkdir -p /data/foot;
        cp "/data/source/${OSM_FILE:-romania-260322.osm.pbf}" /data/foot/;
        osrm-extract -p /opt/foot.lua "/data/foot/${OSM_FILE:-romania-260322.osm.pbf}";
        osrm-partition "/data/foot/${OSM_DATASET:-romania-260322}.osrm";
        osrm-customize "/data/foot/${OSM_DATASET:-romania-260322}.osrm";
    volumes:
      - ./osrm-service/data:/data

  osrm-prepare-driving:
    image: osrm/osrm-backend:latest
    platform: linux/amd64
    container_name: licenta-osrm-prepare-driving
    profiles: ["osrm-prepare"]
    entrypoint: /bin/sh
    command:
      - -lc
      - >
        set -e;
        test -f "/data/source/${OSM_FILE:-romania-260322.osm.pbf}";
        mkdir -p /data/driving;
        cp "/data/source/${OSM_FILE:-romania-260322.osm.pbf}" /data/driving/;
        osrm-extract -p /opt/car.lua "/data/driving/${OSM_FILE:-romania-260322.osm.pbf}";
        osrm-partition "/data/driving/${OSM_DATASET:-romania-260322}.osrm";
        osrm-customize "/data/driving/${OSM_DATASET:-romania-260322}.osrm";
    volumes:
      - ./osrm-service/data:/data

  osrm-foot:
    image: osrm/osrm-backend:latest
    platform: linux/amd64
    container_name: licenta-osrm-foot
    restart: unless-stopped
    command: osrm-routed --algorithm mld --port 5000 "/data/foot/${OSM_DATASET:-romania-260322}.osrm"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '</dev/tcp/127.0.0.1/5000'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    volumes:
      - ./osrm-service/data:/data

  osrm-driving:
    image: osrm/osrm-backend:latest
    platform: linux/amd64
    container_name: licenta-osrm-driving
    restart: unless-stopped
    command: osrm-routed --algorithm mld --port 5001 "/data/driving/${OSM_DATASET:-romania-260322}.osrm"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '</dev/tcp/127.0.0.1/5001'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    volumes:
      - ./osrm-service/data:/data

  aco-service:
    build:
      context: ./aco-service
    container_name: licenta-aco
    restart: unless-stopped
    environment:
      OSRM_FOOT_BASE_URL: http://osrm-foot:5000
      OSRM_DRIVING_BASE_URL: http://osrm-driving:5001
      HTTP_OSRM_TIMEOUT_SECONDS: ${HTTP_OSRM_TIMEOUT_SECONDS:-25}
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '</dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "8000:8000"
    depends_on:
      osrm-foot:
        condition: service_healthy
      osrm-driving:
        condition: service_healthy

  chat-service:
    build:
      context: ./chat-service
    container_name: licenta-chat
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-licenta_db}}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me-use-openssl-rand-hex-32}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      CORS_ORIGINS_RAW: ${CORS_ORIGINS_RAW:-*}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8002/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 6s
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  verification-service:
    build:
      context: ./verification-service
    container_name: licenta-verification
    restart: unless-stopped
    environment:
      VERIFICATION_APPROVE_THRESHOLD: ${VERIFICATION_APPROVE_THRESHOLD:-0.62}
      VERIFICATION_MANUAL_THRESHOLD: ${VERIFICATION_MANUAL_THRESHOLD:-0.50}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8090/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 8s
    ports:
      - "8090:8090"

  backend:
    build:
      context: ./backend
    container_name: licenta-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-licenta_db}}
      ACO_SERVICE_URL: http://aco-service:8000
      VERIFICATION_SERVICE_URL: http://verification-service:8090
      CORS_ORIGINS_RAW: ${CORS_ORIGINS_RAW:-*}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me-use-openssl-rand-hex-32}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      SEED_ADMIN_USER: ${SEED_ADMIN_USER:-true}
      ADMIN_USER_EMAIL: ${ADMIN_USER_EMAIL:-admin@admin.com}
      ADMIN_USER_PASSWORD: ${ADMIN_USER_PASSWORD:-admin}
      ADMIN_USER_FIRST_NAME: ${ADMIN_USER_FIRST_NAME:-Admin}
      ADMIN_USER_LAST_NAME: ${ADMIN_USER_LAST_NAME:-User}
      SEED_DEMO_USER: ${SEED_DEMO_USER:-false}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@example.com}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo1234}
      DEMO_USER_FIRST_NAME: ${DEMO_USER_FIRST_NAME:-Demo}
      DEMO_USER_LAST_NAME: ${DEMO_USER_LAST_NAME:-User}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 8s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      aco-service:
        condition: service_healthy
      verification-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy

volumes:
  postgres_data:
