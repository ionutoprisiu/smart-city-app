# Load application-local.properties if present (credentials; file is gitignored)
spring.profiles.active=local

spring.datasource.url=jdbc:postgresql://localhost:5432/licenta_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# ACO Service Configuration (Python FastAPI)
aco.service.url=http://localhost:8000
